<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srovnávač půjček</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Srovnávač půjček</h1>
        <p>Najděte si nejvýhodnější nabídku na trhu</p>
    </header>

    <main class="container">
        <!-- Ovládací panel s posuvníky ve stylu NerdWallet -->
        <section class="control-panel card">
            <div class="input-group">
                <div class="label-row">
                    <label for="amount">Výše úvěru</label>
                    <div class="input-wrapper">
                        <input type="number" id="amount" value="150000" min="5000" max="2500000" step="5000">
                        <span class="currency">Kč</span>
                    </div>
                </div>
                <input type="range" id="amount-slider" value="150000" min="5000" max="2500000" step="5000">
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="months">Doba splácení</label>
                    <div class="input-wrapper">
                        <input type="number" id="months" value="48" min="6" max="120" step="6">
                        <span class="currency">měsíců</span>
                    </div>
                </div>
                <input type="range" id="months-slider" value="48" min="6" max="120" step="6">
            </div>
        </section>

        <!-- Výsledkové karty -->
        <section id="results" class="results-grid"></section>
    </main>

    <script src="js/calculator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
